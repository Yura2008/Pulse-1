name: Build Pulse APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-pulse.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Pulse source
        run: |
          test -f Pulse_Android_Source_v1.zip
          mkdir source
          unzip -q Pulse_Android_Source_v1.zip -d source
          test -f source/Pulse_Android_Source/settings.gradle.kts

      - name: Enable AndroidX
        run: |
          printf '%s\n' 'android.useAndroidX=true' 'android.enableJetifier=true' >> source/Pulse_Android_Source/gradle.properties

      - name: Fix Health Connect import and Gradle memory
        shell: bash
        run: |
          sed -i 's/^import androidx.health.connect.client.permission.PermissionController$/import androidx.health.connect.client.PermissionController/' source/Pulse_Android_Source/app/src/main/java/com/pulse/health/MainActivity.kt
          cat >> source/Pulse_Android_Source/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          EOF
          grep -F 'import androidx.health.connect.client.PermissionController' source/Pulse_Android_Source/app/src/main/java/com/pulse/health/MainActivity.kt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: source/Pulse_Android_Source
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -s source/Pulse_Android_Source/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature and package
        shell: bash
        run: |
          APK="source/Pulse_Android_Source/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 12
          sha256sum "$APK"

      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-debug-APK
          path: source/Pulse_Android_Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
